---
- name: Apply Amazon Linux 2023 CIS hardening
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Detect UEFI boot on Linux (only if not overridden)
      ansible.builtin.stat:
        path: /sys/firmware/efi
      register: efi
      when: amzn2023cis_legacy_boot is not defined

    - name: Set CIS legacy-boot flag (only if not overridden)
      ansible.builtin.set_fact:
        amzn2023cis_legacy_boot: "{{ not efi.stat.exists }}"
      when: amzn2023cis_legacy_boot is not defined

    - name: Debug detected or overridden value
      ansible.builtin.debug:
        msg: >-
          amzn2023cis_legacy_boot is {{ amzn2023cis_legacy_boot }}
          ({{ 'UEFI' if (efi.stat.exists | default(false)) else 'BIOS or user-forced' }})

  roles:
    - role: "{{ playbook_dir }}"

  post_tasks:
    - name: Override squashfs disable to use /bin/false
      ansible.builtin.replace:
        path: /etc/modprobe.d/CIS.conf
        regexp: '^(#\s*)?install\s+squashfs\s+/bin/true'
        replace: 'install squashfs /bin/false'
        backup: yes

    - name: Override udf disable to use /bin/false
      ansible.builtin.replace:
        path: /etc/modprobe.d/CIS.conf
        regexp: '^(#\s*)?install\s+udf\s+/bin/true'
        replace: 'install udf /bin/false'
        backup: yes

    - name: Copy managed chrony.conf into /etc
      ansible.builtin.copy:
        src: /etc/chrony.d/chronyd.conf
        dest: /etc/chrony.conf
        remote_src: yes
        owner: root
        group: root
        mode: '0644'
        backup: yes

    - name: Override coredump storage to use “0” instead of “none”
      ansible.builtin.lineinfile:
        path: /etc/systemd/coredump.conf
        regexp: '^Storage\s*='
        line: 'Storage=0'
        backup: yes
        create: yes
      notify: Systemd daemon reload
      when:
        - amzn2023cis_rule_1_5_3
        - systemd_coredump.stat.exists



  handlers:
    - name: Restart auditd
      ansible.builtin.shell: service auditd reload