---
- name: Apply Amazon Linux 2023 CIS hardening
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Detect UEFI boot on Linux (only if not overridden)
      ansible.builtin.stat:
        path: /sys/firmware/efi
      register: efi
      when: amzn2023cis_legacy_boot is not defined

    - name: Set CIS legacy-boot flag (only if not overridden)
      ansible.builtin.set_fact:
        amzn2023cis_legacy_boot: "{{ not efi.stat.exists }}"
      when: amzn2023cis_legacy_boot is not defined

    - name: Debug detected or overridden value
      ansible.builtin.debug:
        msg: >-
          amzn2023cis_legacy_boot is {{ amzn2023cis_legacy_boot }}
          ({{ 'UEFI' if (efi.stat.exists | default(false)) else 'BIOS or user-forced' }})

  roles:
    - role: "{{ playbook_dir }}"

  post_tasks:
    - name: Override squashfs disable to use /bin/false
      ansible.builtin.replace:
        path: /etc/modprobe.d/CIS.conf
        regexp: '^(#\s*)?install\s+squashfs\s+/bin/true'
        replace: 'install squashfs /bin/false'
        backup: yes

    - name: Override udf disable to use /bin/false
      ansible.builtin.replace:
        path: /etc/modprobe.d/CIS.conf
        regexp: '^(#\s*)?install\s+udf\s+/bin/true'
        replace: 'install udf /bin/false'
        backup: yes

    - name: Copy managed chrony.conf into /etc
      ansible.builtin.copy:
        src: /etc/chrony.d/chrony.conf
        dest: /etc/chrony.conf
        remote_src: yes
        owner: root
        group: root
        mode: '0644'
        backup: yes

    - name: Override coredump storage to use “0” instead of “none”
      ansible.builtin.lineinfile:
        path: /etc/systemd/coredump.conf
        regexp: '^Storage\s*='
        line: 'Storage=0'
        backup: yes
        create: yes
      notify: Systemd daemon reload
      when:
        - amzn2023cis_rule_1_5_3
        - systemd_coredump.stat.exists

    - name: Check for legacy 99_auditd.rules file
      ansible.builtin.stat:
        path: /etc/audit/rules.d/99_auditd.rules
      register: old_auditd_rules

    - name: Rename 99_auditd.rules → auditd.rules so watches load after -D
      ansible.builtin.command: >
        mv /etc/audit/rules.d/99_auditd.rules
           /etc/audit/rules.d/auditd.rules
      when: old_auditd_rules.stat.exists

    - name: Compile audit rule snippets into /etc/audit/audit.rules
      ansible.builtin.command: augenrules --load

    - name: Load compiled rules into kernel (if auditd not running)
      ansible.builtin.command: auditctl -R /etc/audit/audit.rules
      ignore_errors: yes

    - name: Find all rsyslog.d .conf files
      ansible.builtin.find:
        paths: /etc/rsyslog.d
        patterns: '*.conf'
        file_type: file
      register: rsyslog_d_confs

    - name: Ensure each rsyslog.d config has FileCreateMode 0640
      ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: '^\$FileCreateMode'
        line:   '$FileCreateMode 0640'
        backup: yes
        create: yes
      loop: "{{ rsyslog_d_confs.files }}"

    - name: "1.3.3 | PATCH | Ensure cryptographic mechanisms are used to protect the integrity of audit tools"
      ansible.builtin.blockinfile:
        path: /etc/aide.conf
        marker: "# {mark} Audit tools - CIS benchmark - Ansible-lockdown"
        block: |
          /sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
        validate: aide -D --config %s
      when:
        - amzn2023cis_rule_1_3_3
      tags:
        - level1-server
        - aide
        - file_integrity
        - patch
        - rule_1.3.3
        - NIST800-53R5_AU-2

    - name: "5.1.2.3 | PATCH | Ensure journald compresses large log files"
      ansible.builtin.ini_file:
        path: /etc/systemd/journald.conf
        section: Journal
        option: Compress
        value: yes
        no_extra_spaces: yes
        backup: yes
      notify: Restart journald
      when: amzn2023cis_rule_5_1_2_3
      tags:
        - rule_5.1.2.3

    - name: "5.1.2.4 | PATCH | Ensure journald writes to persistent disk"
      ansible.builtin.ini_file:
        path: /etc/systemd/journald.conf
        section: Journal
        option: Storage
        value: persistent
        no_extra_spaces: yes
        backup: yes
      notify: Restart journald
      when: amzn2023cis_rule_5_1_2_4
      tags:
        - rule_5.1.2.4

  handlers:
    - name: Restart auditd
      ansible.builtin.shell: auditctl -R /etc/audit/audit.rules